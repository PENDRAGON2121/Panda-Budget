name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compute version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').version")
          CODE=$(node scripts/version-code.mjs "$NAME")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$NAME" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$NAME"
              exit 1
            fi
            node scripts/changelog-section.mjs "$NAME" > /dev/null
          fi
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Check signing
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "::notice::Pull request: building a debug APK (signing is never used for PRs)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_KEYSTORE" == "true" && "$HAS_STORE_PASSWORD" == "true" && "$HAS_ALIAS" == "true" && "$HAS_KEY_PASSWORD" == "true" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release tag build requires all four ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets. See docs/android-release.md."
            exit 1
          else
            echo "::warning::Signing secrets not configured: the release APK is NOT signed; building a debug APK instead. See docs/android-release.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Fails early with a clear message; prints only the keystore fingerprint and pass/fail, never secret values.
      - name: Verify keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Keystore SHA-256: $(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1 | tr a-f A-F)"
          echo "Keystore size: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes"
          if printf '%s' "$STORE_PASSWORD" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::warning::The keystore password secret contains non-ASCII characters."
          fi
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "Keystore opens with the password secret and contains the alias."
          else
            echo "::error::The keystore could not be opened with ANDROID_KEYSTORE_PASSWORD (or the alias is missing). Compare the SHA-256 above with: Get-FileHash <your .jks> -Algorithm SHA256"
            exit 1
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../panda-wallet-v${APP_VERSION_NAME}.apk"

      - name: Build debug APK (release not signed)
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../panda-wallet-v${APP_VERSION_NAME}-debug.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: panda-wallet-apk
          path: panda-wallet-v*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.1.8
        with:
          name: panda-wallet-apk

      - name: Extract release notes
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/changelog-section.mjs "$APP_VERSION" > release-notes.md

      - uses: softprops/action-gh-release@v2.2.1
        with:
          files: panda-wallet-v${{ needs.build.outputs.version }}.apk
          body_path: release-notes.md
