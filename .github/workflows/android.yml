name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compute version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').version")
          CODE=$(node scripts/version-code.mjs "$NAME")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$NAME"
            exit 1
          fi
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets not available (fork PR or not configured): the release APK is NOT signed; building a debug APK instead. See docs/android-release.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../panda-wallet-v${APP_VERSION_NAME}.apk"

      - name: Build debug APK (release not signed)
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../panda-wallet-v${APP_VERSION_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: panda-wallet-apk
          path: panda-wallet-v*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.1.8
        with:
          name: panda-wallet-apk

      - name: Extract release notes
        run: node scripts/changelog-section.mjs "${{ needs.build.outputs.version }}" > release-notes.md

      - uses: softprops/action-gh-release@v2.2.1
        with:
          files: panda-wallet-v${{ needs.build.outputs.version }}.apk
          body_path: release-notes.md
